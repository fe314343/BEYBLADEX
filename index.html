<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ---- GitHub 設定：請換成你自己的帳號 / 儲存庫（見 README.md）----
const GITHUB_OWNER = 'YOUR_GITHUB_USERNAME';
const GITHUB_REPO = 'YOUR_REPO_NAME';
const GITHUB_BRANCH = 'main';
const DATA_PATH = 'data/tournament.json';
const POLL_MS = 5000;

const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${DATA_PATH}`;
const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;

// 所有人都能讀（不需要 token），走 GitHub 的公開 CDN，速度快也沒有次數限制
async function fetchTournamentFromGitHub() {
  const res = await fetch(`${RAW_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('讀取失敗');
  const text = await res.text();
  if (!text.trim()) return null;
  return JSON.parse(text);
}

// 寫入需要主辦人自己的 GitHub Token（只在主辦人自己的瀏覽器使用，不會存進網頁原始碼）
async function getFileSha(token) {
  const res = await fetch(API_URL, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('無法讀取檔案資訊，請確認 Token 是否正確、儲存庫設定是否正確。');
  const data = await res.json();
  return data.sha;
}

function toBase64Utf8(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function writeTournamentToGitHub(token, newState) {
  const sha = await getFileSha(token);
  const body = {
    message: `update tournament ${new Date().toISOString()}`,
    content: toBase64Utf8(JSON.stringify(newState, null, 2)),
    branch: GITHUB_BRANCH,
  };
  if (sha) body.sha = sha;
  const res = await fetch(API_URL, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || '寫入失敗，請確認 Token 權限。');
  }
  return res.json();
}

async function deleteTournamentOnGitHub(token) {
  const sha = await getFileSha(token);
  if (!sha) return;
  const res = await fetch(API_URL, {
    method: 'DELETE',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ message: 'reset tournament', sha, branch: GITHUB_BRANCH }),
  });
  if (!res.ok) throw new Error('重置失敗，請確認 Token 權限。');
}

/* ---------------- 共用工具 ---------------- */

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pairRound(list, prefix, roundIdx) {
  const matches = [];
  let idx = 0;
  for (let i = 0; i < list.length; i += 2) {
    if (i + 1 < list.length) {
      matches.push({ key: `${prefix}-${roundIdx}-${idx}`, p1: list[i], p2: list[i + 1], bye: false });
    } else {
      matches.push({ key: `${prefix}-${roundIdx}-${idx}`, p1: list[i], p2: null, bye: true });
    }
    idx++;
  }
  return matches;
}

function isResolved(m, results) {
  return m.bye || !!results[m.key];
}
function winnerOf(m, results) {
  if (m.bye) return m.p1;
  const r = results[m.key];
  return r ? r.winner : null;
}
function loserOf(m, results) {
  if (m.bye) return null;
  const r = results[m.key];
  if (!r) return null;
  return r.winner === m.p1 ? m.p2 : m.p1;
}

/* ---------------- 賽制一／二：單局淘汰 & 敗部復活（挑戰冠軍）---------------- */

function derive(state) {
  const { initialOrder, results } = state;
  const wbRounds = [];
  let currentPlayers = initialOrder;
  let wbChampion = null;
  let wbRoundIdx = 0;
  const lbFeed = [];

  while (true) {
    const round = pairRound(currentPlayers, 'wb', wbRoundIdx);
    wbRounds.push(round);
    if (!round.every((m) => isResolved(m, results))) break;
    const winners = round.map((m) => winnerOf(m, results));
    const losers = round.map((m) => loserOf(m, results)).filter((x) => x !== null);
    lbFeed.push(...losers);
    if (winners.length === 1) {
      wbChampion = winners[0];
      break;
    }
    currentPlayers = winners;
    wbRoundIdx++;
  }

  if (state.format === 'single') {
    return { wbRounds, lbRounds: [], wbChampion, lbChampion: null, finalMatch: null, champion: wbChampion };
  }

  const lbRounds = [];
  let queue = lbFeed;
  let lbRoundIdx = 0;
  let lbChampion = null;
  let lbPending = false;
  while (queue.length >= 2) {
    const round = pairRound(queue, 'lb', lbRoundIdx);
    lbRounds.push(round);
    if (!round.every((m) => isResolved(m, results))) {
      lbPending = true;
      queue = [];
      break;
    }
    queue = round.map((m) => winnerOf(m, results));
    lbRoundIdx++;
  }
  if (!lbPending && queue.length === 1 && wbChampion) {
    lbChampion = queue[0];
  }

  let finalMatch = null;
  let champion = null;
  if (wbChampion && lbChampion) {
    finalMatch = { key: 'final', p1: wbChampion, p2: lbChampion, bye: false };
    if (results.final) champion = results.final.winner;
  }

  return { wbRounds, lbRounds, wbChampion, lbChampion, finalMatch, champion };
}

function getPending(state, derived) {
  const { results } = state;
  const pend = [];
  const lastWB = derived.wbRounds[derived.wbRounds.length - 1];
  if (lastWB) {
    lastWB.forEach((m) => {
      if (!m.bye && !results[m.key]) pend.push({ ...m, bracket: 'wb', roundNo: derived.wbRounds.length });
    });
  }
  const lastLB = derived.lbRounds[derived.lbRounds.length - 1];
  if (lastLB) {
    lastLB.forEach((m) => {
      if (!m.bye && !results[m.key]) pend.push({ ...m, bracket: 'lb', roundNo: derived.lbRounds.length });
    });
  }
  if (derived.finalMatch && !results.final) pend.push({ ...derived.finalMatch, bracket: 'final', roundNo: 1 });
  return pend;
}

function countTotalMatches(n, format) {
  const totalWB = Math.max(n - 1, 0);
  const totalLB = format === 'double' ? Math.max(n - 2, 0) : 0;
  const totalFinal = format === 'double' && n >= 2 ? 1 : 0;
  return totalWB + totalLB + totalFinal;
}

function locateMatch(trackNumber, derived) {
  if (derived.finalMatch && (derived.finalMatch.p1 === trackNumber || derived.finalMatch.p2 === trackNumber)) {
    return { stage: 'final', round: 1, match: derived.finalMatch };
  }
  for (let r = derived.lbRounds.length - 1; r >= 0; r--) {
    const m = derived.lbRounds[r].find((mm) => mm.p1 === trackNumber || mm.p2 === trackNumber);
    if (m) return { stage: 'lb', round: r + 1, match: m };
  }
  for (let r = derived.wbRounds.length - 1; r >= 0; r--) {
    const m = derived.wbRounds[r].find((mm) => mm.p1 === trackNumber || mm.p2 === trackNumber);
    if (m) return { stage: 'wb', round: r + 1, match: m };
  }
  return null;
}

function describeStatus(trackNumber, tournament, derived) {
  const loc = locateMatch(trackNumber, derived);
  if (!loc) return { text: '找不到這個號碼，請確認輸入是否正確。', tone: 'muted' };
  const { stage, round, match } = loc;
  const results = tournament.results;
  const stageLabel = stage === 'wb' ? '勝部' : stage === 'lb' ? '敗部' : '總冠軍戰';
  const opponent = match.p1 === trackNumber ? match.p2 : match.p1;

  if (match.bye) return { text: `第 ${round} 輪輪空，直接晉級下一輪！`, tone: 'good' };
  const resolved = isResolved(match, results);
  if (!resolved) return { text: `${stageLabel}第 ${round} 輪：即將對戰 ${opponent} 號，請準備上場！`, tone: 'live' };
  const winner = winnerOf(match, results);
  if (winner === trackNumber) {
    if (stage === 'final') return { text: '恭喜！你是本次比賽冠軍！', tone: 'champion' };
    return { text: `${stageLabel}第 ${round} 輪獲勝，晉級中，請留意下一輪安排。`, tone: 'good' };
  }
  if (stage === 'final') return { text: '總冠軍戰惜敗，最終成績亞軍，辛苦了！', tone: 'muted' };
  if (stage === 'wb' && tournament.format === 'double') {
    return { text: `你在勝部第 ${round} 輪落敗，已進入敗部候補，請留意安排下一場。`, tone: 'live' };
  }
  return { text: `你在${stageLabel}第 ${round} 輪落敗，比賽結束，感謝參與！`, tone: 'muted' };
}

function getOutcomeType(loc, tournament, trackNumber) {
  const { stage, match } = loc;
  const winner = winnerOf(match, tournament.results);
  const isWinner = winner === trackNumber;
  if (stage === 'final') return isWinner ? null : 'lose_final';
  if (isWinner) return 'win';
  if (stage === 'wb' && tournament.format === 'double') return 'lose_recoverable';
  return 'lose_final';
}

/* ---------------- 賽制三：獎項名次制（1-4名 + 5-8並列 + 敗部第一名）---------------- */

function derivePlacement(state) {
  const { initialOrder, results } = state;
  const wbRounds = [];
  let currentPlayers = initialOrder;
  let wbRoundIdx = 0;
  while (true) {
    const round = pairRound(currentPlayers, 'wb', wbRoundIdx);
    wbRounds.push(round);
    if (!round.every((m) => isResolved(m, results))) break;
    const winners = round.map((m) => winnerOf(m, results));
    if (winners.length === 1) break;
    currentPlayers = winners;
    wbRoundIdx++;
  }

  const lastRound = wbRounds[wbRounds.length - 1];
  const finalDone = lastRound.length === 1 && isResolved(lastRound[0], results);
  const champion = finalDone ? winnerOf(lastRound[0], results) : null;
  const runnerUp = finalDone ? loserOf(lastRound[0], results) : null;

  let thirdPlaceMatch = null;
  let thirdPlace = null;
  let fourthPlace = null;
  const sfRound = wbRounds.length >= 2 ? wbRounds[wbRounds.length - 2] : null;
  const sfResolved = sfRound && sfRound.length === 2 && sfRound.every((m) => isResolved(m, results));
  if (sfResolved) {
    const l1 = loserOf(sfRound[0], results);
    const l2 = loserOf(sfRound[1], results);
    if (l1 != null && l2 != null) {
      thirdPlaceMatch = { key: 'third_place', p1: l1, p2: l2, bye: false };
      if (results.third_place) {
        thirdPlace = results.third_place.winner;
        fourthPlace = thirdPlace === l1 ? l2 : l1;
      }
    }
  }

  const tiedGroups = [];
  for (let r = 1; r < wbRounds.length - 2; r++) {
    const round = wbRounds[r];
    if (round.every((m) => isResolved(m, results))) {
      const losers = round.map((m) => loserOf(m, results)).filter((x) => x != null);
      if (losers.length) tiedGroups.push({ roundNo: r + 1, players: losers });
    }
  }

  const round1 = wbRounds[0];
  const round1Resolved = round1.every((m) => isResolved(m, results));
  const cbRounds = [];
  let cbChampion = null;
  if (round1Resolved) {
    let seed = round1.map((m) => loserOf(m, results)).filter((x) => x != null);
    let idx = 0;
    while (seed.length > 1) {
      const round = pairRound(seed, 'cb', idx);
      cbRounds.push(round);
      if (!round.every((m) => isResolved(m, results))) {
        seed = null;
        break;
      }
      seed = round.map((m) => winnerOf(m, results));
      idx++;
    }
    if (seed && seed.length === 1) cbChampion = seed[0];
  }

  return { wbRounds, champion, runnerUp, thirdPlaceMatch, thirdPlace, fourthPlace, tiedGroups, cbRounds, cbChampion };
}

function getPendingPlacement(state, dp) {
  const { results } = state;
  const pend = [];
  const lastWB = dp.wbRounds[dp.wbRounds.length - 1];
  lastWB.forEach((m) => {
    if (!m.bye && !results[m.key]) pend.push({ ...m, bracket: 'wb', roundNo: dp.wbRounds.length });
  });
  if (dp.thirdPlaceMatch && !results.third_place) {
    pend.push({ ...dp.thirdPlaceMatch, bracket: 'third', roundNo: 1 });
  }
  const lastCB = dp.cbRounds[dp.cbRounds.length - 1];
  if (lastCB) {
    lastCB.forEach((m) => {
      if (!m.bye && !results[m.key]) pend.push({ ...m, bracket: 'cb', roundNo: dp.cbRounds.length });
    });
  }
  return pend;
}

function countTotalMatchesPlacement(n) {
  const totalMain = Math.max(n - 1, 0);
  const totalThird = n >= 4 ? 1 : 0;
  const totalCB = Math.max(Math.floor(n / 2) - 1, 0);
  return totalMain + totalThird + totalCB;
}

function locateMatchPlacement(trackNumber, dp) {
  if (dp.thirdPlaceMatch && (dp.thirdPlaceMatch.p1 === trackNumber || dp.thirdPlaceMatch.p2 === trackNumber)) {
    return { stage: 'third', round: 1, match: dp.thirdPlaceMatch };
  }
  for (let r = dp.cbRounds.length - 1; r >= 0; r--) {
    const m = dp.cbRounds[r].find((mm) => mm.p1 === trackNumber || mm.p2 === trackNumber);
    if (m) return { stage: 'cb', round: r + 1, match: m };
  }
  for (let r = dp.wbRounds.length - 1; r >= 0; r--) {
    const m = dp.wbRounds[r].find((mm) => mm.p1 === trackNumber || mm.p2 === trackNumber);
    if (m) return { stage: 'wb', round: r + 1, match: m };
  }
  return null;
}

function describeStatusPlacement(trackNumber, tournament, dp) {
  const loc = locateMatchPlacement(trackNumber, dp);
  if (!loc) return { text: '找不到這個號碼，請確認輸入是否正確。', tone: 'muted' };
  const { stage, round, match } = loc;
  const results = tournament.results;
  const stageLabel = stage === 'wb' ? '主賽事' : stage === 'cb' ? '敗部' : '季軍戰';
  const opponent = match.p1 === trackNumber ? match.p2 : match.p1;
  const lastIdx = dp.wbRounds.length - 1;
  const roundIdx = round - 1;

  if (match.bye) return { text: `第 ${round} 輪輪空，直接晉級下一輪！`, tone: 'good' };
  const resolved = isResolved(match, results);
  if (!resolved) {
    return { text: `${stageLabel}${stage !== 'third' ? `第 ${round} 輪：` : '：'}即將對戰 ${opponent} 號，請準備上場！`, tone: 'live' };
  }
  const winner = winnerOf(match, results);
  if (winner === trackNumber) {
    if (stage === 'wb' && roundIdx === lastIdx) return { text: '恭喜！你是本次比賽冠軍！', tone: 'champion' };
    if (stage === 'third') return { text: '恭喜獲得季軍（第 3 名）！', tone: 'champion' };
    if (stage === 'cb' && dp.cbChampion === trackNumber) return { text: '恭喜獲得敗部第一名！', tone: 'champion' };
    return { text: `${stageLabel}獲勝，晉級中，請留意下一場安排。`, tone: 'good' };
  }
  if (stage === 'wb' && roundIdx === lastIdx) return { text: '總決賽惜敗，最終成績亞軍，辛苦了！', tone: 'muted' };
  if (stage === 'third') return { text: '季軍戰惜敗，最終成績第 4 名，辛苦了！', tone: 'muted' };
  if (stage === 'wb' && roundIdx === 0) return { text: '第 1 輪落敗，已進入敗部，請留意安排下一場敗部賽。', tone: 'live' };
  if (stage === 'wb' && roundIdx === lastIdx - 1) return { text: '準決賽惜敗，將迎接季軍戰，請留意安排。', tone: 'live' };
  if (stage === 'wb') return { text: `第 ${round} 輪落敗，並列較佳名次，比賽結束，感謝參與！`, tone: 'muted' };
  return { text: `敗部第 ${round} 輪落敗，比賽結束，感謝參與！`, tone: 'muted' };
}

function getOutcomeTypePlacement(loc, tournament, dp, trackNumber) {
  const { stage, match } = loc;
  const winner = winnerOf(match, tournament.results);
  const isWinner = winner === trackNumber;
  if (stage === 'wb') {
    const roundIdx = loc.round - 1;
    const lastIdx = dp.wbRounds.length - 1;
    if (roundIdx === lastIdx) return isWinner ? 'win' : 'lose_final';
    if (isWinner) return 'win';
    if (roundIdx === lastIdx - 1) return 'lose_recoverable';
    if (roundIdx === 0) return 'lose_recoverable';
    return 'lose_final';
  }
  return isWinner ? 'win' : 'lose_final';
}

/* ---------------- 依賽制分流的共用包裝 ---------------- */

function deriveAny(tournament) {
  return tournament.format === 'placement' ? derivePlacement(tournament) : derive(tournament);
}
function getPendingAny(tournament, d) {
  return tournament.format === 'placement' ? getPendingPlacement(tournament, d) : getPending(tournament, d);
}
function countTotalAny(tournament) {
  return tournament.format === 'placement' ? countTotalMatchesPlacement(tournament.n) : countTotalMatches(tournament.n, tournament.format);
}
function describeStatusAny(trackNumber, tournament, d) {
  return tournament.format === 'placement' ? describeStatusPlacement(trackNumber, tournament, d) : describeStatus(trackNumber, tournament, d);
}
function locateMatchAny(trackNumber, tournament, d) {
  return tournament.format === 'placement' ? locateMatchPlacement(trackNumber, d) : locateMatch(trackNumber, d);
}
function getOutcomeTypeAny(loc, tournament, d, trackNumber) {
  return tournament.format === 'placement' ? getOutcomeTypePlacement(loc, tournament, d, trackNumber) : getOutcomeType(loc, tournament, trackNumber);
}

/* ---------------- 對戰樹狀圖版面計算 ---------------- */

const BOX_W = 148;
const BOX_H = 56;
const COL_W = 196;
const ROW_GAP = 22;

function computeLayout(rounds) {
  const positions = {};
  if (!rounds || rounds.length === 0) return { positions, connectors: [], width: 0, height: 0 };

  rounds[0].forEach((m, i) => {
    const y = i * (BOX_H + ROW_GAP) + BOX_H / 2;
    positions[m.key] = { x: 0, y };
  });

  for (let r = 1; r < rounds.length; r++) {
    rounds[r].forEach((m, i) => {
      const c1 = rounds[r - 1][2 * i];
      const c2 = rounds[r - 1][2 * i + 1];
      let y;
      if (c1 && c2) y = (positions[c1.key].y + positions[c2.key].y) / 2;
      else if (c1) y = positions[c1.key].y;
      else y = i * (BOX_H + ROW_GAP) + BOX_H / 2;
      positions[m.key] = { x: r * COL_W, y };
    });
  }

  const connectors = [];
  for (let r = 1; r < rounds.length; r++) {
    rounds[r].forEach((m, i) => {
      const c1 = rounds[r - 1][2 * i];
      const c2 = rounds[r - 1][2 * i + 1];
      if (c1) connectors.push({ from: c1.key, to: m.key });
      if (c2) connectors.push({ from: c2.key, to: m.key });
    });
  }

  const allY = Object.values(positions).map((p) => p.y);
  const height = Math.max(...allY) + BOX_H / 2 + 24;
  const width = rounds.length * COL_W + BOX_W;
  return { positions, connectors, width, height };
}

function MatchBox({ pos, match, results, trackNumber }) {
  const resolved = isResolved(match, results);
  const w = winnerOf(match, results);
  const x = pos.x;
  const y = pos.y - BOX_H / 2;
  const rowH = BOX_H / 2;
  const p1Win = resolved && w === match.p1;
  const p2Win = resolved && match.p2 !== null && w === match.p2;
  const isLive = !match.bye && !resolved;
  const isTracked = trackNumber != null && (match.p1 === trackNumber || match.p2 === trackNumber);

  return (
    <g className={isLive ? 'stt-live-pulse' : ''}>
      {isTracked && (
        <rect x={x - 4} y={y - 4} width={BOX_W + 8} height={BOX_H + 8} rx="12" fill="none" stroke="var(--track)" strokeWidth="2" strokeDasharray="5,3" />
      )}
      <rect x={x} y={y} width={BOX_W} height={BOX_H} rx="9" fill="var(--surface2)" stroke={isLive ? 'var(--accent)' : 'var(--border)'} strokeWidth="1" />
      {p1Win && <rect x={x} y={y} width={BOX_W} height={rowH} rx="9" fill="var(--accent-dim)" />}
      {p2Win && <rect x={x} y={y + rowH} width={BOX_W} height={rowH} rx="9" fill="var(--accent-dim)" />}
      <line x1={x} y1={y + rowH} x2={x + BOX_W} y2={y + rowH} stroke="var(--border)" strokeWidth="1" />
      <text x={x + 14} y={y + rowH / 2 + 6} fontFamily="JetBrains Mono, monospace" fontSize="15" fontWeight={p1Win ? '700' : '400'} fill={p1Win ? 'var(--accent)' : 'var(--text)'}>
        {match.p1} 號
      </text>
      {p1Win && <circle cx={x + BOX_W - 16} cy={y + rowH / 2} r="3.5" fill="var(--accent)" />}
      <text x={x + 14} y={y + rowH + rowH / 2 + 6} fontFamily="JetBrains Mono, monospace" fontSize="15" fontWeight={p2Win ? '700' : '400'} fill={p2Win ? 'var(--accent)' : match.bye ? 'var(--muted)' : 'var(--text)'}>
        {match.p2 !== null ? `${match.p2} 號` : match.bye ? '輪空' : '？'}
      </text>
      {p2Win && <circle cx={x + BOX_W - 16} cy={y + rowH + rowH / 2} r="3.5" fill="var(--accent)" />}
    </g>
  );
}

function BracketTree({ title, rounds, results, trackNumber }) {
  if (!rounds || rounds.length === 0) return null;
  const layout = computeLayout(rounds);
  return (
    <div className="stt-section">
      <h3 className="stt-section-title">{title}</h3>
      <div className="stt-tree-scroll">
        <svg width={layout.width} height={layout.height} style={{ display: 'block' }}>
          {layout.connectors.map((c, i) => {
            const from = layout.positions[c.from];
            const to = layout.positions[c.to];
            const x1 = from.x + BOX_W;
            const y1 = from.y;
            const x2 = to.x;
            const y2 = to.y;
            const midX = x1 + (x2 - x1) / 2;
            return <path key={i} d={`M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`} fill="none" stroke="var(--border)" strokeWidth="1.5" />;
          })}
          {rounds.map((round) => round.map((m) => <MatchBox key={m.key} pos={layout.positions[m.key]} match={m} results={results} trackNumber={trackNumber} />))}
          {rounds.map((round, r) => (
            <text key={`label-${r}`} x={r * COL_W + BOX_W / 2} y={14} textAnchor="middle" fontFamily="Oswald, sans-serif" fontSize="11" fill="var(--muted)">
              第{r + 1}輪
            </text>
          ))}
        </svg>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {
    live: { label: '待輸入結果', bg: 'rgba(242,169,59,0.16)', fg: 'var(--accent)' },
    done: { label: '已完成', bg: 'rgba(61,218,166,0.14)', fg: 'var(--good)' },
    bye: { label: '輪空晉級', bg: 'var(--surface2)', fg: 'var(--muted)' },

function StatusBar({ tournament, derived }) {
  const total = countTotalAny(tournament);
  const completed = Object.keys(tournament.results).length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  let mainLabel, subLabel;
  if (tournament.format === 'placement') {
    mainLabel = derived.champion ? `冠軍：${derived.champion} 號` : `主賽事：第 ${derived.wbRounds.length} 輪`;
    subLabel = derived.cbChampion ? `敗部第一名：${derived.cbChampion} 號` : derived.cbRounds.length > 0 ? `敗部：第 ${derived.cbRounds.length} 輪` : '敗部：尚未開始';
  } else {
    mainLabel = derived.wbChampion ? `勝部冠軍：${derived.wbChampion} 號` : `勝部：第 ${derived.wbRounds.length} 輪`;
    subLabel =
      tournament.format === 'double'
        ? derived.lbChampion
          ? `敗部代表：${derived.lbChampion} 號`
          : derived.lbRounds.length > 0
          ? `敗部：第 ${derived.lbRounds.length} 輪`
          : '敗部：尚未開始'
        : null;
  }

  return (
    <div className="stt-statusbar">
      <div className="stt-status-row">
        <span>{mainLabel}</span>
        {subLabel && <span>{subLabel}</span>}
        <span>{completed} / {total} 場完成</span>
      </div>
      <div className="stt-progress-track">
        <div className="stt-progress-fill" style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function StatusCard({ tournament, derived, loginInfo, onSwitch }) {

  return (

function Confetti() {
  const pieces = useMemo(
    () =>
      Array.from({ length: 36 }).map((_, i) => ({
        left: Math.random() * 100,
        delay: Math.random() * 0.7,
        duration: 2.1 + Math.random() * 1.4,
        color: ['#f2a93b', '#3ddaa6', '#5aa9ff', '#ff9d8a'][i % 4],
        rotate: Math.random() * 360,
        size: 5 + Math.random() * 6,
      })),
    []
  );
  return (
    <div className="stt-confetti-wrap">
      {pieces.map((p, i) => (
        <span
          key={i}
          className="stt-confetti-piece"
          style={{
            left: `${p.left}%`,
            animationDelay: `${p.delay}s`,
            animationDuration: `${p.duration}s`,
            background: p.color,
            width: p.size,
            height: p.size * 0.45,
            transform: `rotate(${p.rotate}deg)`,
          }}
        />
      ))}

}

function LoginScreen({ onSubmit, onSkip }) {
  const [num, setNum] = useState('');

function SingleMatchCard({ title, subLabel, match, results, trackNumber, resultText }) {
  const resolved = isResolved(match, results);
  const w = winnerOf(match, results);
  const status = resolved ? 'done' : 'live';
  const isTracked = trackNumber != null && (match.p1 === trackNumber || match.p2 === trackNumber);
  return (
    <div className="stt-section">
      <h3 className="stt-section-title">{title}</h3>
      <div
        className={`stt-match ${!resolved ? 'stt-live-pulse-box' : ''}`}
        style={{ maxWidth: 320, outline: isTracked ? '2px dashed var(--track)' : 'none', outlineOffset: 3 }}
      >
        <div className="stt-match-top">
          <span className="stt-match-label">{subLabel}</span>
          <StatusBadge status={status} />
        </div>
        <div className="stt-match-players">
          <div className={`stt-player ${resolved && w === match.p1 ? 'stt-player-win' : ''}`}>
            <span className="stt-num">{match.p1}</span>
            <span className="stt-num-suffix">號</span>
          </div>
          <span className="stt-vs">VS</span>
          <div className={`stt-player ${resolved && w === match.p2 ? 'stt-player-win' : ''}`}>
            <span className="stt-num">{match.p2}</span>
            <span className="stt-num-suffix">號</span>

}

function App() {
  const [tournament, setTournament] = useState(undefined);
  const [mode, setMode] = useState('viewer');
  const [nInput, setNInput] = useState('32');
  const [formatInput, setFormatInput] = useState('single');
  const [titleInput, setTitleInput] = useState('');
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [formState, setFormState] = useState({});
  const [lastSync, setLastSync] = useState(null);
  const [loginInfo, setLoginInfo] = useState(undefined);
  const [popup, setPopup] = useState(null);
  const [token, setToken] = useState(() => {
    try {
      return localStorage.getItem('spintop_gh_token') || '';
    } catch (e) {
      return '';
    }
  });
  const shownRef = useRef(new Set());
  const pollRef = useRef(null);

  const updateToken = (val) => {
    setToken(val);
    try {
      localStorage.setItem('spintop_gh_token', val);
    } catch (e) {}
  };

  const loadState = useCallback(async () => {
    try {
      const data = await fetchTournamentFromGitHub();
      setTournament(data);
    } catch (e) {
      setTournament(null);
    }
    setLastSync(Date.now());
  }, []);

  // GitHub 沒有即時推播，改用輪詢；每個人讀的是公開的 raw 檔案，不需要 token
  useEffect(() => {
    loadState();
    pollRef.current = setInterval(loadState, POLL_MS);
    return () => clearInterval(pollRef.current);
  }, [loadState]);

  const persist = async (newState) => {
    if (!token) {
      setError('請先在下方貼上你的 GitHub Token 才能送出結果。');
      return;
    }
    setTournament(newState);
    setSaving(true);
    try {
      await writeTournamentToGitHub(token, newState);
      setError('');
    } catch (e) {
      setError(e.message || '儲存失敗，請檢查 Token 或網路連線後再試一次。');
    }
    setSaving(false);
  };

  const handleCreate = () => {
    const n = parseInt(nInput, 10);
    if (!n || n < 2) {
      setError('請輸入 2 以上的參賽人數。');
      return;
    }
    setError('');
    const order = shuffle(Array.from({ length: n }, (_, i) => i + 1));
    persist({
      n,
      format: formatInput,
      title: titleInput.trim() || null,
      initialOrder: order,
      results: {},
      players: {},
      createdAt: Date.now(),
    });
  };

  const handleReset = async () => {
    if (!token) {
      setError('請先在下方貼上你的 GitHub Token 才能重置賽程。');
      return;
    }
    try {
      await deleteTournamentOnGitHub(token);
      setError('');
    } catch (e) {
      setError(e.message || '重置失敗。');
    }
    setTournament(null);
    setConfirmReset(false);
    setFormState({});
  };

  const submitResult = (matchKey) => {
    const fs = formState[matchKey] || {};
    const winner = fs.winner;
    if (!winner) {
      setError('請先選擇這一場的獲勝號碼。');
      return;
    }
    setError('');
    const score = fs.score === undefined || fs.score === '' ? null : Number(fs.score);
    const newResults = { ...tournament.results, [matchKey]: { winner, score, ts: Date.now() } };
    persist({ ...tournament, results: newResults });
    setFormState((prev) => {
      const next = { ...prev };
      delete next[matchKey];
      return next;
    });
  };

  const updateForm = (matchKey, patch) => {
    setFormState((prev) => ({ ...prev, [matchKey]: { ...prev[matchKey], ...patch } }));
  };

  const derived = tournament ? deriveAny(tournament) : null;
  const pending = tournament && derived ? getPendingAny(tournament, derived) : [];
  const displayTitle = (tournament && tournament.title) || '陀螺競技場';
  const trackNumber = loginInfo ? loginInfo.number : null;
  const isPlacement = tournament && tournament.format === 'placement';

  useEffect(() => {
    if (loginInfo && tournament && tournament.players && tournament.players[loginInfo.number] !== loginInfo.name) {
      persist({ ...tournament, players: { ...(tournament.players || {}), [loginInfo.number]: loginInfo.name } });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loginInfo, tournament]);

  useEffect(() => {
    shownRef.current = new Set();
  }, [loginInfo && loginInfo.number]);

  useEffect(() => {
    if (!loginInfo || !tournament || !derived) return;
    const loc = locateMatchAny(loginInfo.number, tournament, derived);
    if (!loc || loc.match.bye) return;
    if (!isResolved(loc.match, tournament.results)) return;
    if (shownRef.current.has(loc.match.key)) return;
    shownRef.current.add(loc.match.key);
    const type = getOutcomeTypeAny(loc, tournament, derived, loginInfo.number);
    if (type) setPopup(type);

  }, [tournament, derived, loginInfo]);

        @keyframes stt-champion-border { 0%,100% { box-shadow: 0 0 0px rgba(242,169,59,0.4);} 50% { box-shadow: 0 0 26px rgba(242,169,59,0.4);} }
        .stt-champion-label { color: var(--muted); font-size:12px; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:10px; }
        .stt-champion-num { font-family:'Oswald',sans-serif; font-size:56px; font-weight:700; color: var(--accent); line-height:1; animation: stt-champion-pop 0.5s ease; }
        @keyframes stt-champion-pop { 0% { transform: scale(0.4); opacity:0; } 70% { transform: scale(1.12); opacity:1;} 100% { transform: scale(1); } }
        .stt-champion-sub { margin-top:8px; color: var(--muted); font-size:13px; }

        .stt-confetti-wrap { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
        .stt-confetti-piece { position:absolute; top:-12px; opacity:0.95; animation-name: stt-confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards; border-radius:1px; }
        @keyframes stt-confetti-fall { 0% { transform: translateY(-12px) rotate(0deg); opacity:1;} 100% { transform: translateY(260px) rotate(360deg); opacity:0;} }

        .stt-overlay { position:fixed; inset:0; background:rgba(10,11,14,0.86); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; animation: stt-fade-in 0.25s ease; }
        @keyframes stt-fade-in { from{opacity:0} to{opacity:1} }
        .stt-outcome-card { position:relative; overflow:hidden; background: var(--surface); border:2px solid; border-radius:20px; padding:38px 28px; text-align:center; max-width:300px; width:100%; animation: stt-outcome-pop 0.45s cubic-bezier(.34,1.56,.64,1); }
        @keyframes stt-outcome-pop { 0% { transform: scale(0.55); opacity:0;} 100% { transform: scale(1); opacity:1;} }
        .stt-outcome-emoji { font-size:58px; margin-bottom:14px; animation: stt-emoji-bounce 0.7s ease-in-out infinite alternate; }
        @keyframes stt-emoji-bounce { from{ transform: translateY(0);} to{ transform: translateY(-9px);} }
        .stt-outcome-title { font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; margin-bottom:6px; }
        .stt-outcome-name { font-size:14px; color: var(--text); margin-bottom:10px; }
        .stt-outcome-sub { color:var(--muted); font-size:13px; margin-bottom:22px; line-height:1.5; }

        .stt-empty { text-align:center; color: var(--muted); padding: 60px 20px; font-size:14px; }
        .stt-sync { font-size:11px; color: var(--muted); text-align:right; margin-bottom: 14px; }
        .stt-note { font-size:11px; color: var(--muted); margin-top:6px; }
      `}</style>

      <OutcomePopup outcome={popup} name={loginInfo ? loginInfo.name : ''} onClose={() => setPopup(null)} />

      <div className="stt-header">
        <div className="stt-title">
          <SpinIcon size={22} spinning={pending.length > 0} />
          {displayTitle}
        </div>
        <div className="stt-mode-toggle">
          <button className={`stt-mode-btn ${mode === 'viewer' ? 'active' : ''}`} onClick={() => setMode('viewer')}>參賽者檢視</button>
          <button className={`stt-mode-btn ${mode === 'admin' ? 'active' : ''}`} onClick={() => setMode('admin')}>主辦人操作</button>
        </div>
      </div>

      <div className="stt-sync">
        {saving ? '同步中…' : lastSync ? `上次更新 ${new Date(lastSync).toLocaleTimeString('zh-TW')}` : ''}
      </div>

      {error && <div className="stt-error">{error}</div>}

      {mode === 'admin' && (
        <div className="stt-card">
          <span className="stt-label">GitHub Token（用來寫入比賽結果，只存在你自己的瀏覽器）</span>
          <input
            className="stt-input"
            type="password"
            value={token}
            onChange={(e) => updateToken(e.target.value)}
            placeholder="貼上你的 Personal Access Token"
          />
          <div className="stt-note">參賽者檢視不需要這個欄位，只有主辦人送出比賽結果時才會用到。設定方式見 README.md。</div>
        </div>
      )}

      {tournament === undefined && <div className="stt-empty">載入中…</div>}

      {mode === 'viewer' && tournament === null && <div className="stt-empty">主辦人尚未建立賽程，請稍候。</div>}

      {mode === 'viewer' && tournament && loginInfo === undefined && (
        <LoginScreen onSubmit={(info) => setLoginInfo(info)} onSkip={() => setLoginInfo(null)} />
      )}

      {mode === 'admin' && tournament === null && (
        <div className="stt-card">
          <span className="stt-label">活動名稱（選填）</span>
          <input className="stt-input" type="text" value={titleInput} onChange={(e) => setTitleInput(e.target.value)} placeholder="例如：第三屆社區陀螺大賽" style={{ marginBottom: 16 }} />

          <span className="stt-label">參賽人數</span>
          <input className="stt-input" type="number" min="2" value={nInput} onChange={(e) => setNInput(e.target.value)} placeholder="例如 32" />

          <span className="stt-label" style={{ marginTop: 16 }}>賽制</span>
          <div className="stt-choice-row">
            <button className={`stt-format-btn ${formatInput === 'single' ? 'selected' : ''}`} onClick={() => setFormatInput('single')}>單局淘汰制</button>
            <button className={`stt-format-btn ${formatInput === 'double' ? 'selected' : ''}`} onClick={() => setFormatInput('double')}>敗部復活制</button>
            <button className={`stt-format-btn ${formatInput === 'placement' ? 'selected' : ''}`} onClick={() => setFormatInput('placement')}>獎項名次制</button>
          </div>
          {formatInput === 'placement' && (
            <div className="stt-note">
              決賽定 1、2 名；準決賽輸家加賽季軍戰定 3、4 名；中間輪次輸家並列名次、不需再比；第一輪輸家另跑一個小型敗部，決出「敗部第一名」。
            </div>
          )}

          <div style={{ marginTop: 14 }}>
            <button className="stt-btn" onClick={handleCreate}>產生對戰表</button>
          </div>
          <div className="stt-note">系統會將 1~N 號隨機排列成第一輪對戰。人數若非 2 的次方，多出的選手會自動輪空晉級一輪。</div>
        </div>
      )}

      {tournament && derived && (mode === 'admin' || loginInfo !== undefined) && (
        <>
          <StatusBar tournament={tournament} derived={derived} />

          {derived.champion && (
            <div className="stt-champion">
              <Confetti />
              <div className="stt-champion-label">總冠軍</div>
              <div className="stt-champion-num">{derived.champion} 號</div>
              <div className="stt-champion-sub">
                {tournament.players && tournament.players[derived.champion] ? `${tournament.players[derived.champion]}　` : ''}
                恭喜奪冠！比賽結束
              </div>
            </div>
          )}

          {mode === 'viewer' && loginInfo && !derived.champion && (
            <StatusCard tournament={tournament} derived={derived} loginInfo={loginInfo} onSwitch={() => setLoginInfo(undefined)} />
          )}

          {mode === 'admin' && pending.length > 0 && (
            <div className="stt-section">
              <h3 className="stt-section-title">待輸入結果</h3>
              {pending.map((m) => {
                const fs = formState[m.key] || {};
                const label =
                  m.bracket === 'wb' ? `勝部 第${m.roundNo}輪` :
                  m.bracket === 'lb' ? `敗部 第${m.roundNo}輪` :
                  m.bracket === 'third' ? '季軍戰（3、4名）' :
                  m.bracket === 'cb' ? `敗部 第${m.roundNo}輪` :
                  '總冠軍戰';
                return (
                  <div className="stt-pending-card" key={m.key}>
                    <div className="stt-pending-top"><span className="stt-match-label">{label}</span></div>
                    <div className="stt-pending-vs">{m.p1} 號 <span style={{ color: 'var(--muted)', fontSize: 14 }}>VS</span> {m.p2} 號</div>
                    <div className="stt-choice-row">
                      <button className={`stt-choice-btn ${fs.winner === m.p1 ? 'selected' : ''}`} onClick={() => updateForm(m.key, { winner: m.p1 })}>{m.p1} 號勝</button>
                      <button className={`stt-choice-btn ${fs.winner === m.p2 ? 'selected' : ''}`} onClick={() => updateForm(m.key, { winner: m.p2 })}>{m.p2} 號勝</button>
                    </div>
                    <span className="stt-label">得分（疊圈數，選填）</span>
                    <input className="stt-input" type="number" value={fs.score ?? ''} onChange={(e) => updateForm(m.key, { score: e.target.value })} placeholder="例如 3" style={{ marginBottom: 12 }} />
                    <button className="stt-btn" style={{ width: '100%' }} onClick={() => submitResult(m.key)}>送出結果，晉級下一輪</button>
                  </div>
                );
              })}
            </div>
          )}

          {isPlacement ? (
            <>
              <BracketTree title="主賽事對戰樹" rounds={derived.wbRounds} results={tournament.results} trackNumber={trackNumber} />
              {derived.thirdPlaceMatch && (
                <SingleMatchCard
                  title="季軍戰（3、4名）"
                  subLabel="準決賽敗者對決"
                  match={derived.thirdPlaceMatch}
                  results={tournament.results}
                  trackNumber={trackNumber}
                  resultText={(w) => `${w} 號榮獲季軍（4名：${w === derived.thirdPlaceMatch.p1 ? derived.thirdPlaceMatch.p2 : derived.thirdPlaceMatch.p1} 號）`}
                />
              )}
              {derived.tiedGroups.map((g, i) => (
                <div className="stt-section" key={`tied-${i}`}>
                  <h3 className="stt-section-title">並列名次（第 {g.roundNo} 輪淘汰）</h3>
                  <div className="stt-tied-card">{g.players.map((p) => `${p} 號`).join('、')}　－　不需再賽</div>
                </div>
              ))}
              {derived.cbRounds.length > 0 && (
                <BracketTree title="敗部（爭敗部第一名）" rounds={derived.cbRounds} results={tournament.results} trackNumber={trackNumber} />
              )}
              {derived.cbChampion && (
                <div className="stt-section">
                  <h3 className="stt-section-title">敗部第一名</h3>
                  <div className="stt-tied-card">{derived.cbChampion} 號</div>
                </div>
              )}
            </>
          ) : (
            <>
              <BracketTree title={tournament.format === 'single' ? '對戰樹' : '勝部對戰樹'} rounds={derived.wbRounds} results={tournament.results} trackNumber={trackNumber} />
              {tournament.format !== 'single' && <BracketTree title="敗部對戰樹" rounds={derived.lbRounds} results={tournament.results} trackNumber={trackNumber} />}
              {derived.finalMatch && (
                <SingleMatchCard
                  title="總冠軍戰"
                  subLabel="勝部冠軍 VS 敗部代表"
                  match={derived.finalMatch}
                  results={tournament.results}
                  trackNumber={trackNumber}
                  resultText={(w) => `${w} 號奪冠`}
                />
              )}
            </>
          )}

          {mode === 'admin' && (
            <div className="stt-card" style={{ marginTop: 8 }}>
              {!confirmReset ? (
                <button className="stt-btn stt-btn-ghost" onClick={() => setConfirmReset(true)}>重置整個賽程</button>
              ) : (
                <div>
                  <div style={{ marginBottom: 10, fontSize: 13, color: 'var(--muted)' }}>確定要清除目前所有比賽紀錄，重新開始嗎？此動作無法復原。</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button className="stt-btn stt-btn-danger" onClick={handleReset}>確定重置</button>
                    <button className="stt-btn stt-btn-ghost" onClick={() => setConfirmReset(false)}>取消</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
